# ============================================================
# LCTA 自托管状态服务 — 默认配置模板
# ============================================================
# 部署时将本文件复制为同目录 config.yaml 再修改:
#     copy tools\default_config.yaml tools\config.yaml
# config.yaml 已加入 .gitignore,不会提交到仓库。

# resources.assets 路径;为空字符串时按
# steamcmd.install_dir → Steam 默认路径 的顺序解析
asset: ""

# ---------- HTTP 服务 ----------
server:
  # 服务地址;
  host: "0.0.0.0"
  # 监听端口
  port: 8080

# ---------- 新 token 确认 ----------
polling:
  # 扫描到新 token 后等待 mtime 保持稳定的秒数,避免 steamcmd 半写入时误触发
  stability: 30

# ---------- 更新窗口 ----------
# 游戏主要在每周四北京时间 11:00 更新,此处从 10:00 开始到 13:00 结束,
# 每 15 分钟遍历一次(先 steamcmd 更新,再扫描 resources.assets)。
# 窗口外不运行,保留 POST /api/check 手动触发。
schedule:
  # 总开关;关闭后始终按 interval 遍历
  enabled: true
  # 星期几(0=周一 ... 3=周四)
  update_dow: 3
  # 窗口开始小时(北京时间)
  start_hour: 10
  # 窗口结束小时(北京时间,不包含该时刻)
  end_hour: 13
  # 窗口内遍历间隔(秒)
  interval: 900

# ---------- SteamCMD ----------
steamcmd:
  # steamcmd 可执行文件路径;为空则不执行 steamcmd
  path: ""
  # 游戏 AppID
  app_id: 1973530
  # 安装目录;为空使用 steamcmd 默认安装位置,否则使用 +force_install_dir
  install_dir: ""
  # 登录方式;免费游戏可使用 anonymous
  login: "anonymous"
  # 单次执行超时(秒)
  timeout: 900

# ---------- GitHub dispatch ----------
github:
  # 触发自动更新的仓库,owner/repository 格式
  repository: "HZBHZB1234/LCTA_auto_update"
  # repository_dispatch 的 event_type
  event_type: "voidfissure_update"
  # GitHub token;只填写在本地 config.yaml 中,不要提交到仓库
  token: ""

# 已 dispatch 的 token 记录文件,防止重启后重复触发
state: "~/.lcta_status_server.json"

# 发现新 token 时是否自动调用 repository_dispatch
dispatch: true

# 提取到新 token 时是否在线校验,并在 /api/status 响应中加入 hash 字段
verify: false
