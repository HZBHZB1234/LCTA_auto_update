name: Build And Publish LCTA

on:
  repository_dispatch:
    types:
      - voidfissure_update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lcta-auto-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install 7-Zip
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('src/config.json', encoding='utf-8'))['publishing']['seven_zip'] else 1)"; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          else
            echo "7Z publishing is disabled"
          fi

      - name: Build localization package
        id: build
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
          LCTA_FETCHER: ${{ secrets.LCTA_FETCHER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python ./src/main.py

      - name: Create or update Release
        if: steps.build.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.version }}
          name: LCTA Release ${{ steps.build.outputs.version }}
          body_path: update.md
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

      - name: Upload diagnostics
        if: always() && steps.build.outputs.diagnostics_enabled != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: lcta-diagnostics-${{ github.run_id }}
          path: |
            src/app.log
            run-summary.json
            translation-dump.jsonl
            release-assets/
            diagnostics/
          if-no-files-found: warn
          retention-days: 7
